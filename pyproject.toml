[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symptom-sage"
version = "0.1.0"
description = "Symptom-checker RAG built from transcribed doctor-patient interviews"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
pinecone = ["pinecone>=5.0"]
app = ["streamlit>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
symptom-sage = "symptom_sage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symptom_sage = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
